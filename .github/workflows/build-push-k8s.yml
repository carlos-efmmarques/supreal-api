name: Build & Push k8s (Harbor)

# SIDE-BY-SIDE pipeline: does NOT touch the existing GitLab CI / .233 deploy.
# Builds on the in-cluster self-hosted runner (jump-01), pushes to the LAN-only
# Harbor, then bumps deploy/kustomization.yaml so Argo CD rolls it out to the
# cluster as api.k8s.supreal.com.br. Tag-bump commit carries [skip ci].
#
# The tag-bump commit is mirrored to the GitLab remote so both remotes keep the
# same main; otherwise a local `git push` (which targets both) is rejected on
# GitHub as non-fast-forward. Requires the GITLAB_SSH_KEY secret: a GitLab
# deploy key for this project with write access, stored base64-encoded (a raw
# PEM also works, but pasting one tends to mangle its line breaks).

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/**'
      - 'argocd/**'
      - '**.md'
      - '.github/**'
      - '.gitlab-ci.yml'

permissions:
  contents: write

concurrency:
  group: build-push-k8s
  cancel-in-progress: false

env:
  IMAGE: harbor.k8s.supreal.com.br/library/supreal-api
  GITLAB_REMOTE: git@gitlab.supermercadosreal.com.br:carlos.eduardo/supreal-api.git

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: echo "$HARBOR_PASSWORD" | docker login harbor.k8s.supreal.com.br -u "$HARBOR_USERNAME" --password-stdin

      - name: Build & push
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            -t "$IMAGE:${{ steps.tag.outputs.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ steps.tag.outputs.sha }}"
          docker push "$IMAGE:latest"

      - name: Bump image tag in deploy/ and commit
        id: bump
        run: |
          set -euo pipefail
          sed -i "s/^\(\s*newTag:\).*/\1 ${{ steps.tag.outputs.sha }}/" deploy/kustomization.yaml
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add deploy/kustomization.yaml
          if ! git commit -m "ci: deploy ${{ steps.tag.outputs.sha }} [skip ci]"; then
            echo "no change"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Mirror tag-bump commit to GitLab
        if: steps.bump.outputs.pushed == 'true'
        env:
          GITLAB_SSH_KEY: ${{ secrets.GITLAB_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_SSH_KEY:-}" ]; then
            echo "::error::GITLAB_SSH_KEY secret is not set; GitLab and GitHub main will diverge."
            exit 1
          fi
          # Keep the key off the shared self-hosted runner's ~/.ssh.
          KEYDIR="$(mktemp -d)"
          trap 'rm -rf "$KEYDIR"' EXIT
          umask 077
          # Accept the secret either base64-encoded (preferred: survives copy/paste
          # intact) or as a raw PEM, and strip any CR the paste may have introduced.
          if printf '%s' "$GITLAB_SSH_KEY" | grep -q 'PRIVATE KEY'; then
            printf '%s\n' "$GITLAB_SSH_KEY" | tr -d '\r' > "$KEYDIR/id"
          else
            printf '%s' "$GITLAB_SSH_KEY" | tr -d '\r\n' | base64 -d > "$KEYDIR/id"
          fi
          chmod 600 "$KEYDIR/id"
          if ! ssh-keygen -y -f "$KEYDIR/id" > /dev/null 2>&1; then
            echo "::error::GITLAB_SSH_KEY is not a usable private key (mangled line breaks, truncated, or passphrase-protected). Re-add it with: base64 < deploy_key | pbcopy"
            exit 1
          fi
          if ! ssh-keyscan -H gitlab.supermercadosreal.com.br > "$KEYDIR/known_hosts" 2>"$KEYDIR/keyscan.err"; then
            echo "::error::ssh-keyscan could not reach the GitLab host from this runner:"
            cat "$KEYDIR/keyscan.err"
            exit 1
          fi
          GIT_SSH_COMMAND="ssh -i $KEYDIR/id -o IdentitiesOnly=yes -o UserKnownHostsFile=$KEYDIR/known_hosts" \
            git push "$GITLAB_REMOTE" HEAD:main

      - name: Free disk on jump-01 (image stays in Harbor; keep cache for speed)
        if: always()
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          docker rmi "$IMAGE:$SHA" "$IMAGE:latest" 2>/dev/null || true
          docker image prune -f || true
          docker builder prune -f --keep-storage 20gb || true
